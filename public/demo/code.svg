<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Demo code editor screenshot">
  <rect width="800" height="450" fill="#1e2228"/>
  <rect x="0" y="0" width="800" height="40" fill="#171a1f"/>
  <circle cx="22" cy="20" r="5" fill="#3a4048"/>
  <circle cx="40" cy="20" r="5" fill="#3a4048"/>
  <circle cx="58" cy="20" r="5" fill="#3a4048"/>
  <text x="84" y="25" font-family="Consolas, monospace" font-size="12" fill="#8b949e">rename_lectures.py</text>

  <g font-family="Consolas, monospace" font-size="14">
    <text x="26" y="78" fill="#4d555f">1</text>
    <text x="60" y="78" fill="#c586c0">import</text><text x="122" y="78" fill="#9cdcfe"> os, re</text>
    <text x="26" y="104" fill="#4d555f">2</text>
    <text x="26" y="130" fill="#4d555f">3</text>
    <text x="60" y="130" fill="#6a9955"># week numbers come out as 'w3', 'W03', 'week 3'</text>
    <text x="26" y="156" fill="#4d555f">4</text>
    <text x="60" y="156" fill="#569cd6">PATTERN</text><text x="146" y="156" fill="#d4d4d4"> = </text><text x="174" y="156" fill="#ce9178">r"w(?:eek)?\s*0?(\d+)"</text>
    <text x="26" y="182" fill="#4d555f">5</text>
    <text x="26" y="208" fill="#4d555f">6</text>
    <text x="60" y="208" fill="#569cd6">def</text><text x="98" y="208" fill="#dcdcaa"> tidy</text><text x="142" y="208" fill="#d4d4d4">(folder):</text>
    <text x="26" y="234" fill="#4d555f">7</text>
    <text x="88" y="234" fill="#c586c0">for</text><text x="126" y="234" fill="#9cdcfe"> name </text><text x="186" y="234" fill="#c586c0">in</text><text x="216" y="234" fill="#dcdcaa"> os</text><text x="240" y="234" fill="#d4d4d4">.listdir(folder):</text>
    <text x="26" y="260" fill="#4d555f">8</text>
    <text x="116" y="260" fill="#9cdcfe">hit</text><text x="146" y="260" fill="#d4d4d4"> = </text><text x="174" y="260" fill="#dcdcaa">re</text><text x="196" y="260" fill="#d4d4d4">.search(PATTERN, name, </text><text x="448" y="260" fill="#dcdcaa">re</text><text x="470" y="260" fill="#d4d4d4">.I)</text>
    <text x="26" y="286" fill="#4d555f">9</text>
    <text x="116" y="286" fill="#c586c0">if</text><text x="142" y="286" fill="#c586c0"> not</text><text x="184" y="286" fill="#9cdcfe"> hit</text><text x="214" y="286" fill="#d4d4d4">:</text>
    <text x="20" y="312" fill="#4d555f">10</text>
    <text x="146" y="312" fill="#c586c0">continue</text>
    <text x="20" y="338" fill="#4d555f">11</text>
    <text x="116" y="338" fill="#9cdcfe">week</text><text x="158" y="338" fill="#d4d4d4"> = </text><text x="186" y="338" fill="#4ec9b0">int</text><text x="214" y="338" fill="#d4d4d4">(hit.group(</text><text x="318" y="338" fill="#b5cea8">1</text><text x="330" y="338" fill="#d4d4d4">))</text>
    <text x="20" y="364" fill="#4d555f">12</text>
    <text x="116" y="364" fill="#dcdcaa">os</text><text x="140" y="364" fill="#d4d4d4">.rename(name, </text><text x="278" y="364" fill="#ce9178">f"week-{week:02d}.pdf"</text><text x="490" y="364" fill="#d4d4d4">)</text>
  </g>

  <rect x="0" y="404" width="800" height="46" fill="#171a1f"/>
  <text x="26" y="432" font-family="Consolas, monospace" font-size="12" fill="#2A7C99">$ python rename_lectures.py ~/Downloads</text>
  <text x="380" y="432" font-family="Consolas, monospace" font-size="12" fill="#8b949e">renamed 14 files</text>
</svg>
